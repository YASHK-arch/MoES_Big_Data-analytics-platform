[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sih26069-weather-platform"
version = "0.1.0"
description = "National Weather Big Data Analytics Platform (SIH26069)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "geoalchemy2>=0.14.4",
    "alembic>=1.13.1",
    "httpx>=0.27.0",
    "defusedxml>=0.7.1",
    "python-magic>=0.4.27",
    "prometheus_client>=0.20.0",
    "orjson>=3.9.0",
    "greenlet>=3.0.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    "boto3>=1.34.0",
    "python-multipart>=0.0.9",
    "shapely>=2.0.0",
    "email-validator>=2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
