server {
    listen 80;
    server_name _;

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    # Real client IP from trusted upstream proxy (docker demo stack has 1 nginx)
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # ── Block /metrics from outside ────────────────────────────────────────────
    location /metrics {
        return 403;
    }

    # ── Health & Readiness Probes ──────────────────────────────────────────────
    location ~ ^/(health|ready) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API proxy ──────────────────────────────────────────────────────────────
    location /api {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SSE endpoint: disable buffering, extend timeout ───────────────────────
    location /api/v1/events/stream {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # SSE requires chunked transfer; disable gzip for event-stream
        proxy_set_header Accept-Encoding "";
    }

    # ── Static SPA files ───────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Gzip for text assets only (not event-stream)
    gzip on;
    gzip_types application/json application/javascript text/css text/javascript;
    gzip_min_length 1000;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
